name: risklens
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  moralis: ^0.0.3+4
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  http: ^0.13.6
  image_picker: ^1.0.7
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "launcher.png"
  adaptive_icon_background: "#87CEEB"
  adaptive_icon_foreground: "launcher.png"
  remove_alpha_ios: true